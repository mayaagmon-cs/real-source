<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Source Verification & Headlines</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <h1 class="title">Source Verification</h1>
      <p class="subtitle">Quick verification for the term <strong class="target-word">איזנקוט</strong></p>

      <!-- Initial state: Only "Enter source" button -->
      <div id="initial-view">
        <button id="enter-source-btn" class="btn primary-btn" type="button">
          Enter source
        </button>
      </div>

      <!-- Second state: Input, "Check source" button, and HeadLines display -->
      <div id="input-view" class="hidden">
        <div class="input-row">
          <div class="input-wrapper">
            <label for="source-input" class="sr-only">Source URL or Text</label>
            <textarea
              id="source-input"
              class="text-input"
              rows="2"
              placeholder="Enter source URL (e.g. https://...) or paste text directly..."
              autocomplete="off"
            ></textarea>
          </div>
          <!-- V mark or X mark next to text box -->
          <div id="input-badge" class="result-badge hidden" aria-live="polite"></div>
        </div>

        <div class="button-row">
          <button id="check-source-btn" class="btn primary-btn" type="button">
            Check source
          </button>
          <!-- Red X mark next to button if not found -->
          <div id="button-badge" class="result-badge hidden" aria-live="polite"></div>
        </div>

        <div id="status-message" class="status-message hidden" role="status"></div>

        <!-- HeadLines section -->
        <div class="headlines-section">
          <div class="headlines-header">
            <label for="headlines-output" class="headlines-title">HeadLines</label>
            <div class="headlines-controls">
              <span id="headlines-count" class="headlines-count hidden"></span>
              <button id="toggle-log-btn" type="button" class="log-toggle-btn" title="Toggle Scraping Engine Inspection Log">
                Inspection Log
              </button>
            </div>
          </div>
          <textarea
            id="headlines-output"
            class="text-input headlines-textarea"
            rows="8"
            readonly
            placeholder="Headlines diagnosed through the upgraded scraping engine will be presented here..."
          ></textarea>

          <!-- Scraping Engine Inspection & Diagnostics Panel -->
          <div id="scraping-log-panel" class="scraping-log-panel hidden">
            <div class="log-panel-header">
              <div class="log-panel-title">
                <span class="terminal-dot"></span> Scraping Engine Inspection & Diagnostic Log
              </div>
              <span id="bot-shield-status" class="bot-badge badge-neutral">Ready</span>
            </div>
            <pre id="scraping-log-content" class="log-content">Waiting for inspection run...</pre>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
