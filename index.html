<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sources Headline Diagnosis & Comparison</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="container">
    <div class="card">
      <h1 class="title">Sources Headline Diagnosis</h1>
      <p class="subtitle">Extract and compare headlines across multiple sources</p>

      <!-- Main Input & Verification Form -->
      <div id="input-view">
        <!-- Dual Source Input Grid -->
        <div class="sources-dual-grid">
          <div class="source-input-group">
            <label for="source-input-1" class="input-label">Source 1 (URL or Text)</label>
            <textarea
              id="source-input-1"
              class="text-input"
              rows="3"
              placeholder="Paste first source URL (e.g. https://...) or article text..."
              autocomplete="off"
            ></textarea>
            <div id="input-badge-1" class="result-badge hidden" aria-live="polite"></div>
          </div>

          <div class="source-input-group">
            <label for="source-input-2" class="input-label">Source 2 (URL or Text)</label>
            <textarea
              id="source-input-2"
              class="text-input"
              rows="3"
              placeholder="Paste second source URL (e.g. https://...) or article text..."
              autocomplete="off"
            ></textarea>
            <div id="input-badge-2" class="result-badge hidden" aria-live="polite"></div>
          </div>
        </div>

        <!-- Action Row -->
        <div class="button-row">
          <button id="check-source-btn" class="btn primary-btn" type="button" onclick="handleCheckSources()">
            Check Sources
          </button>
          <div id="button-badge" class="result-badge hidden" aria-live="polite"></div>
        </div>

        <!-- Quick Test Helpers -->
        <div class="quick-helpers-row">
          <span class="helpers-label">Quick Test Helpers:</span>
          <button id="btn-sample-articles" type="button" class="chip-btn" onclick="loadSampleArticles()">
            ⚡ Load Sample Articles
          </button>
          <button id="btn-sample-urls" type="button" class="chip-btn" onclick="loadSampleUrls()">
            🌐 Load Sample URLs
          </button>
          <button id="btn-clear-all" type="button" class="chip-btn chip-clear" onclick="clearAllSources()">
            🗑️ Clear
          </button>
        </div>

        <!-- Status Message Banner -->
        <div id="status-message" class="status-message hidden" role="status"></div>

        <!-- Dual HeadLines Display Grid -->
        <div class="headlines-dual-grid">
          <!-- HeadLines 1 -->
          <div class="headlines-box-wrapper">
            <div class="headlines-header">
              <label for="headlines-output-1" class="headlines-title">HeadLines 1</label>
              <span id="headlines-count-1" class="headlines-count hidden"></span>
            </div>
            <textarea
              id="headlines-output-1"
              class="text-input headlines-textarea"
              rows="9"
              readonly
              placeholder="Headlines from Source 1 will appear here..."
            ></textarea>
          </div>

          <!-- HeadLines 2 -->
          <div class="headlines-box-wrapper">
            <div class="headlines-header">
              <label for="headlines-output-2" class="headlines-title">HeadLines 2</label>
              <span id="headlines-count-2" class="headlines-count hidden"></span>
            </div>
            <textarea
              id="headlines-output-2"
              class="text-input headlines-textarea"
              rows="9"
              readonly
              placeholder="Headlines from Source 2 will appear here..."
            ></textarea>
          </div>
        </div>

        <!-- Headline Comparison Section -->
        <section class="comparison-section">
          <div class="comparison-header">
            <h2 class="comparison-title">Compare Headlines</h2>
            <p class="comparison-subtitle">Select or enter two headlines to compare their similarity and shared content</p>
          </div>

          <!-- Dual Headline Compare Inputs -->
          <div class="sources-dual-grid comparison-grid">
            <div class="source-input-group">
              <label for="first-headline-input" class="input-label">First Headline</label>
              <textarea
                id="first-headline-input"
                class="text-input headline-compare-input"
                rows="3"
                placeholder="Enter or paste first headline..."
                autocomplete="off"
              ></textarea>
            </div>

            <div class="source-input-group">
              <label for="second-headline-input" class="input-label">Second Headline</label>
              <textarea
                id="second-headline-input"
                class="text-input headline-compare-input"
                rows="3"
                placeholder="Enter or paste second headline..."
                autocomplete="off"
              ></textarea>
            </div>
          </div>

          <!-- Compare Button Row -->
          <div class="button-row">
            <button id="compare-btn" class="btn primary-btn compare-btn" type="button" onclick="handleCompareHeadlines()">
              Compare
            </button>
          </div>

          <!-- Compare Helpers Row -->
          <div class="quick-helpers-row">
            <button id="btn-use-main-headlines" type="button" class="chip-btn" onclick="populateMainHeadlinesForComparison()">
              📋 Use Extracted Main Headlines
            </button>
            <button id="btn-clear-compare" type="button" class="chip-btn chip-clear" onclick="clearComparisonFields()">
              🗑️ Clear
            </button>
          </div>

          <!-- Comparison Result Display Area -->
          <div id="compare-result" class="compare-result hidden" aria-live="polite"></div>
        </section>

        <!-- Scraping Engine Diagnostics & Inspection Panel -->
        <div class="inspection-panel-wrapper">
          <div class="inspection-toggle-bar">
            <button id="toggle-log-btn" type="button" class="log-toggle-btn" onclick="toggleInspectionLog()">
              Inspection Log
            </button>
            <span id="bot-shield-status" class="bot-badge badge-neutral">Ready</span>
          </div>

          <div id="scraping-log-panel" class="scraping-log-panel hidden">
            <div class="log-panel-header">
              <div class="log-panel-title">
                <span class="terminal-dot"></span> Scraping Engine Inspection & Diagnostic Log
              </div>
            </div>
            <pre id="scraping-log-content" class="log-content">Waiting for inspection run...</pre>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="script.js?v=5"></script>
</body>
</html>
