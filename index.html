<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Source</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4f1e8;
        --muted: #aaa99f;
        --orange: #ff6b35;
        --panel: #171817;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 78% 18%, rgba(255, 107, 53, 0.12), transparent 24rem),
          linear-gradient(135deg, #101110 0%, #090a09 100%);
      }

      main {
        position: relative;
        display: grid;
        align-content: center;
        min-height: 100vh;
        padding: 6vw 8vw;
      }

      main::after {
        content: "";
        position: absolute;
        right: 8vw;
        bottom: 8vw;
        width: 18rem;
        height: 18rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        box-shadow:
          0 0 0 4rem rgba(255, 255, 255, 0.018),
          0 0 0 8rem rgba(255, 255, 255, 0.012);
        pointer-events: none;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0 0 1.5rem;
        color: var(--orange);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 2.5rem;
        height: 2px;
        background: var(--orange);
      }

      h1 {
        max-width: 8ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(4.5rem, 11vw, 9.5rem);
        font-weight: 500;
        line-height: 0.82;
        letter-spacing: -0.07em;
      }

      h1 span {
        display: block;
        margin-left: 0.55em;
        color: var(--orange);
        font-style: italic;
      }

      .footer {
        position: absolute;
        bottom: 3vw;
        left: 8vw;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        main {
          padding: 2rem;
        }

        h1 {
          font-size: clamp(4rem, 20vw, 6rem);
        }

        main::after {
          right: -8rem;
          bottom: 5rem;
        }

        .footer {
          bottom: 2rem;
          left: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Independent journal</p>
      <h1>Real <span>Source</span></h1>
      <p class="footer">Ideas worth tracing</p>
    </main>
  </body>
</html>
